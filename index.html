<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#667eea" />

    <!-- Favicons - required for Google search result icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA / Web App Manifest - used by Chrome, Android, etc. -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://pradetra.com/" />

    <!-- Open Graph - use absolute URLs so Google/social can show your icon -->
    <meta property="og:description" content="Pradetra is the flagship service brand and We focused on delivering high-quality digital operations support to global businesses.
              Our core services include Data Collection, Manual QA Testing,  Annotation, Transcription,
              Translation & Localization, and LLM Support Services.">
    <meta property="og:url" content="https://pradetra.com/">
    <meta property="og:image" content="https://pradetra.com/android-chrome-512x512.png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:alt" content="Pradetra">
    <!-- Basic Meta -->
    <meta charset="UTF-8" />
    <meta name="description" content="Pradetra is the flagship service brand and We focused on delivering high-quality digital operations support to global businesses.
              Our core services include Data Collection, Manual QA Testing,  Annotation, Transcription,
              Translation & Localization, and LLM Support Services." />
    <meta name="keywords" content="Pradetra" />
    <meta name="author" content="Shivendra" />

<!-- Open Graph (for LinkedIn, Facebook, Google, etc.) -->
    <meta property="og:title" content="Pradetra" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pradetra" />

    <title>Pradetra</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Pradetra",
      "url": "https://pradetra.com/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://pradetra.com/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Pradetra",
      "url": "https://pradetra.com/",
      "logo": "https://pradetra.com/android-chrome-512x512.png",
      "sameAs": ["https://www.linkedin.com/company/pradetra/"]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
